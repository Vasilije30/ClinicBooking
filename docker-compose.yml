services:
  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.Api/Dockerfile
    container_name: identity-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=identity-db;Port=5432;Database=identity;Username=postgres;Password=postgres
      Jwt__Key: ${JWT_KEY}
    ports:
      - "5106:8080"
    depends_on:
      identity-db:
        condition: service_healthy

  directory-api:
    build:
      context: .
      dockerfile: src/Services/Directory/Directory.Api/Dockerfile
    container_name: directory-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=directory-db;Port=5432;Database=directory;Username=postgres;Password=postgres
      Jwt__Key: ${JWT_KEY}
    ports:
      - "5107:8080"
    depends_on:
      directory-db:
        condition: service_healthy

  scheduling-api:
    build:
      context: .
      dockerfile: src/Services/Scheduling/Scheduling.Api/Dockerfile
    container_name: scheduling-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=scheduling-db;Port=5432;Database=scheduling;Username=postgres;Password=postgres
      Jwt__Key: ${JWT_KEY}
      Services__Directory__BaseUrl: http://directory-api:8080/
      RabbitMq__Host: rabbitmq
    ports:
      - "5108:8080"
    depends_on:
      scheduling-db:
        condition: service_healthy
      directory-api:
        condition: service_started
      rabbitmq:
        condition: service_started

  notifications-worker:
    build:
      context: .
      dockerfile: src/Services/Notifications/Notifications.Worker/Dockerfile
    container_name: notifications-worker
    environment:
      DOTNET_ENVIRONMENT: Development
      RabbitMq__Host: rabbitmq
      Email__Host: mailpit
      Email__Port: "1025"
    depends_on:
      - rabbitmq
      - mailpit

  identity-db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    image: postgres:16
    container_name: identity-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: identity
    ports:
      - "5433:5432"
    volumes:
      - identity-data:/var/lib/postgresql/data
  
  directory-db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    image: postgres:16
    container_name: directory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: directory
    ports:
      - "5434:5432"
    volumes:
      - directory-data:/var/lib/postgresql/data

  scheduling-db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    image: postgres:16
    container_name: scheduling-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scheduling
    ports:
      - "5435:5432"
    volumes:
      - scheduling-data:/var/lib/postgresql/data
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
  
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - identity-api
      - directory-api
      - scheduling-api

volumes:
  identity-data:
  directory-data:
  scheduling-data:
  
    