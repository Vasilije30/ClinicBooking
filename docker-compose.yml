services:
  identity-db:
    image: postgres:16
    container_name: identity-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: identity
    ports:
      - "5433:5432"
    volumes:
      - identity-data:/var/lib/postgresql/data
  
  directory-db:
    image: postgres:16
    container_name: directory-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: directory
    ports:
      - "5434:5432"
    volumes:
      - directory-data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

volumes:
  identity-data:
  directory-data:
  
    